name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile application
        run: python -m compileall -q main.py campaign.py config.py sms_service utils tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  security-audit:
    name: Dependency and data-safety audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject unexpected tracked datasets
        shell: bash
        run: |
          mapfile -t tracked_datasets < <(
            git ls-files '*.csv' '*.tsv' '*.xlsx' '*.xls' '*.parquet' '*.feather' '*.jsonl' '*.vcf'
          )
          for file in "${tracked_datasets[@]}"; do
            if [[ "$file" != "examples/contacts.example.csv" ]]; then
              echo "Unexpected tracked dataset: $file"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

  docker-build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [test, security-audit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t batch-sms-campaign-automation:ci .

      - name: Verify non-root runtime
        run: |
          uid="$(docker run --rm --entrypoint id batch-sms-campaign-automation:ci -u)"
          test "$uid" != "0"

      - name: Smoke test Dry Run
        run: |
          docker run --rm \
            -e SMS_DRY_RUN=true \
            -e SMS_SEND_ENABLED=false \
            -e SMS_CSV_FILE_PATH=/tmp/contacts.csv \
            -e SMS_LOG_FILE=/tmp/sms_campaign.log \
            -v "$PWD/examples/contacts.example.csv:/tmp/contacts.csv:ro" \
            batch-sms-campaign-automation:ci
